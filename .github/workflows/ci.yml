name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon-lint:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: ./snapframe

  version:
    name: Version / changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: config.yaml version must have a CHANGELOG entry
        run: |
          version="$(grep -E '^version:' snapframe/config.yaml | head -1 | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')"
          echo "Add-on version: ${version}"
          if ! grep -qF "## [${version}]" snapframe/CHANGELOG.md; then
            echo "::error file=snapframe/CHANGELOG.md::No '## [${version}]' section in CHANGELOG.md"
            exit 1
          fi

  dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: snapframe/Dockerfile
          failure-threshold: error

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --shell=bash --severity=error --exclude=SC1091 \
            snapframe/rootfs/usr/bin/*.sh

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet -r snapframe/requirements.txt ruff
      - name: Syntax check
        run: python -m compileall -q snapframe/rootfs/usr/bin
      - name: Ruff (syntax errors and undefined names)
        run: |
          ruff check --select E9,F63,F7,F82 --target-version py312 \
            snapframe/rootfs/usr/bin tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check app.js
        run: node --check snapframe/rootfs/usr/share/snapframe/static/app.js

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ./snapframe
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.20
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
