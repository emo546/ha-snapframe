name: "SnapFrame – Digital Photo Frame"
version: "3.0.2"
slug: "snapframe"
description: "Turn any old tablet or iPad into a smart digital photo frame. Watches an SMB share, converts HEIC/HEIF to JPG, and serves a fullscreen slideshow with albums, EXIF date/GPS overlay, swipe gestures, web upload, night mode, a motion-triggered weather screen and waste-collection reminders. Home Assistant ingress and MQTT discovery included."
url: "https://github.com/emo546/ha-snapframe"
arch:
  - aarch64
  - amd64
# Po prvom úspešnom behu workflow "Release" odkomentuj – Home Assistant potom
# stiahne hotový obraz namiesto toho, aby ho buildoval na zariadení.
# Predtým to nezapínaj: obraz, ktorý v registri ešte nie je, znemožní inštaláciu.
# image: "ghcr.io/emo546/{arch}-addon-snapframe"
init: false
map:
  - type: addon_config
    read_only: false
options:
  smb_server: "192.168.1.100"
  smb_share: "Photos"
  smb_version: "3.0"
  smb_username: ""
  smb_password: ""
  watch_folder: "/sambamount/upload"
  output_folder: "/sambamount/converted"
  delete_original: true
  jpg_quality: 92
  thumb_quality: 82
  thumb_max_px: 1024
  thumb_cache: "addon"
  scan_interval_hours: 12
  slideshow_seconds: 30
  web_port: 8099
  basic_auth_user: ""
  basic_auth_password: ""
  language: "sk"
  sleep_start: ""
  sleep_end: ""
  weather_photo_interval: 8
  weather_mode_duration_minutes: 120
  anthropic_api_key: ""
  api_token: ""
  mqtt_enabled: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  smb_server: str
  smb_share: str
  smb_version: "list(3.1.1|3.0|2.1|1.0)"
  smb_username: str
  smb_password: password
  watch_folder: str
  output_folder: str
  delete_original: bool
  jpg_quality: int(1,100)
  thumb_quality: int(1,100)
  thumb_max_px: int(256,3840)
  thumb_cache: "list(addon|share)"
  scan_interval_hours: int(1,168)
  slideshow_seconds: int(3,300)
  web_port: port
  basic_auth_user: str
  basic_auth_password: password
  language: str
  sleep_start: str
  sleep_end: str
  weather_photo_interval: int(2,50)
  weather_mode_duration_minutes: int(5,720)
  anthropic_api_key: "password?"
  api_token: "password?"
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "SnapFrame slideshow web interface"
# Ingress = chránené UI priamo v Home Assistante (bez otvárania portu),
# mapovaný port zostáva pre tablety, ktoré idú na rám priamo.
# ingress_port sa neuvádza – 8099 je jeho default a linter ho inak odmietne.
ingress: true
panel_icon: mdi:image-multiple
full_access: true
apparmor: false
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
