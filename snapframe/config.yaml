name: "SnapFrame – Digital Photo Frame"
version: "2.11.0"
slug: "snapframe"
description: "Turn any old tablet or iPad into a smart digital photo frame. Watches an SMB share, converts HEIC/HEIF to JPG, and serves a fullscreen slideshow with albums, EXIF date/GPS overlay, swipe gestures, web upload, night mode, a motion-triggered weather screen and waste-collection reminders."
url: "https://github.com/emo546/ha-snapframe"
arch:
  - aarch64
  - amd64
init: false
map:
  - type: addon_config
    read_only: false
options:
  smb_server: "192.168.1.100"
  smb_share: "Photos"
  smb_username: ""
  smb_password: ""
  watch_folder: "/sambamount/upload"
  output_folder: "/sambamount/converted"
  delete_original: true
  jpg_quality: 92
  thumb_quality: 82
  thumb_max_px: 1024
  thumb_cache: "addon"
  scan_interval_hours: 12
  slideshow_seconds: 30
  web_port: 8099
  basic_auth_user: ""
  basic_auth_password: ""
  language: "sk"
  sleep_start: ""
  sleep_end: ""
  weather_photo_interval: 8
  weather_mode_duration_minutes: 120
  anthropic_api_key: ""
  api_token: ""
schema:
  smb_server: str
  smb_share: str
  smb_username: str
  smb_password: password
  watch_folder: str
  output_folder: str
  delete_original: bool
  jpg_quality: int(1,100)
  thumb_quality: int(1,100)
  thumb_max_px: int(256,3840)
  thumb_cache: "list(addon|share)"
  scan_interval_hours: int(1,168)
  slideshow_seconds: int(3,300)
  web_port: port
  basic_auth_user: str
  basic_auth_password: password
  language: str
  sleep_start: str
  sleep_end: str
  weather_photo_interval: int(2,50)
  weather_mode_duration_minutes: int(5,720)
  anthropic_api_key: "password?"
  api_token: "password?"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "SnapFrame slideshow web interface"
# Ingress = chránené UI priamo v Home Assistante (bez otvárania portu),
# mapovaný port zostáva pre tablety, ktoré idú na rám priamo.
ingress: true
ingress_port: 8099
panel_icon: mdi:image-multiple
webui: "http://[HOST]:[PORT:8099]"
# Keď server prestane odpovedať, Supervisor add-on reštartuje.
watchdog: "http://[HOST]:[PORT:8099]/health"
full_access: true
apparmor: false
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
